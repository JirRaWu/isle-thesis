# 简屿 · 论文 Isle Thesis
# 访问地址：https://isle-thesis.hhtj.cn/
#
# 静态站点：托管构建产物 dist/（无上游 Node / Docker 应用进程）
#
# 部署前请确认：
# 1. DNS：isle-thesis.hhtj.cn A 记录指向本机公网 IP
# 2. 证书：/usr/local/nginx/cert/isle-thesis.hhtj.cn_nginx/ 下放置 fullchain.pem、privkey.pem
#    （可用 Certimate 签发 *.hhtj.cn 或单独子域证书）
# 3. 构建并同步产物到 root 目录：
#      VITE_ISLE_CV_ORIGIN=https://isle-cv.hhtj.cn \
#      VITE_ISLE_PHOTO_ORIGIN=https://isle-photo.hhtj.cn \
#      pnpm build
#      rsync -avz --delete dist/ user@server:/var/www/isle-thesis/dist/
# 4. 确认 dist/samples/ 含试用样例 DOCX（pnpm sample:thesis 后重新 build）
# 5. 复制本配置到服务器 vhost 目录后校验并重载：
#      sudo cp deploy/nginx/30_isle-thesis.hhtj.cn_80_443.conf /usr/local/nginx/conf/vhost/
#      nginx -t && systemctl reload nginx
#    （Nginx 由 systemd 管理，勿直接执行 nginx 启动，以免双开）
#
# 说明：
# - DOCX 解析与格式检查均在浏览器完成；可选 AI 由用户浏览器直连服务商。
# - 服务端无状态，不存论文、不存 API Key。
# - index.html 勿长期缓存；/assets 可 immutable 长缓存；样例 DOCX 可中等缓存。

server {
    listen 80;
    server_name isle-thesis.hhtj.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name isle-thesis.hhtj.cn;

    ssl_certificate      /usr/local/nginx/cert/isle-thesis.hhtj.cn_nginx/fullchain.pem;
    ssl_certificate_key  /usr/local/nginx/cert/isle-thesis.hhtj.cn_nginx/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/isle-thesis/dist;
    index index.html;

    # 上传 / 下载的样例体积可能较大，按需放宽（默认 client_max_body_size 往往够用）
    client_max_body_size 40m;

    # HTML 入口：发版后立刻拿到新资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite 带 hash 的静态资源
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 内置试用样例 DOCX
    location /samples/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        types {
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
        }
        default_type application/octet-stream;
    }

    # SPA：真实文件优先，否则回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
